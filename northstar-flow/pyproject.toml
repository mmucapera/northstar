[project]
name = "ns-orchestrator"
version = "0.1.0"
description = "NS Orchestrator — Pipeline management, ADLS poller, and Fabric notebook trigger"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pyodbc==5.2.0",
    "azure-identity==1.24.0",
    "azure-storage-file-datalake",
    "pydantic==2.11.0",
    "pydantic-settings==2.6.0",
    "python-dotenv==1.0.1",
    "httpx>=0.27.0",
    "gunicorn>=23.0.0",
    "structlog==24.4.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
