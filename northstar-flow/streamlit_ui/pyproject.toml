[project]
name = "ns-orchestrator-ui"
version = "0.1.0"
description = "Streamlit operations dashboard for NS Orchestrator"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.37.0",
    "httpx>=0.27.0",
    "pyodbc==5.2.0",
    "azure-identity==1.24.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "components", "pages"]
