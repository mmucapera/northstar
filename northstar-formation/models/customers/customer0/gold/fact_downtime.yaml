model:
  name: fact_downtime
  description: CUSTOMER0 gold deferred production hours fact
  layer: gold
  kind: TABLE
  customer: customer0
  owner: data_engineering
  tags: [gold, fact, customer0, oil_gas, pre_discovery]
  refresh_frequency: daily
  domain: gold
  load_strategy: merge

source:
  base_table: silver.downtime
  depends_on_tables:
    - silver.downtime
  merge_keys:
    merge_keys:
      - PeriodId_key
      - CauseId_key
    load_strategy: silver_to_gold

transformations:
  columns:
    - name: PeriodId_key
      expression: CAST(xxhash64(PeriodId) AS BIGINT)
      data_type: BIGINT
    - name: CauseId_key
      expression: CAST(xxhash64(CauseId) AS BIGINT)
      data_type: BIGINT
    - name: Hours
      expression: Hours
      data_type: DECIMAL(18,2)
    - name: Manifest_package
      data_type: VARCHAR (8000)
    - name: Manifest_file
      data_type: VARCHAR (8000)

  inherit_columns: false
