# CUSTOMER0 bronze partner - JV partner reference data. Shape matches
# Project Spark's `Partner` type exactly (src/data/delta-basin.ts).
# Pre-discovery - see docs/customer0-pilot-kickoff.md.
#
# dim_/fact_ naming is reserved for gold (the star-schema layer) - bronze and
# silver use plain entity names, matching the rest of the framework's
# convention (models/_base/{bronze,silver} never prefix table names either).

model:
  name: partner
  description: CUSTOMER0 bronze JV partner reference data
  layer: bronze
  kind: TABLE
  extends: null
  customer: customer0
  owner: data_engineering
  tags: [bronze, schema_only, customer0, oil_gas, pre_discovery, dim]
  refresh_frequency: daily
  domain: bronze
source:
  base_table: __SCHEMA_ONLY__
transformations:
  inherit_columns: false
  columns:
  - name: PartnerId
    data_type: VARCHAR(50)
    description: Stable partner slug (natural key) - e.g. "customer0", "shoreline"
  - name: PartnerName
    data_type: VARCHAR(200)
    description: Display name - e.g. "CUSTOMER0 Upstream"
  - name: PartnerRole
    data_type: VARCHAR(100)
    description: One of Operator, Non-operating partner, State participant
  - name: EquityPct
    data_type: DECIMAL(6,3)
    description: JV equity share, percent
  - name: Sourcefile
    data_type: STRING
  - name: Manifest_package
    data_type: STRING
  - name: Manifest_file
    data_type: STRING
  - name: Load_date
    expression: current_date
    data_type: DATE
  - name: Load_timestamp
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: Partitionkey
    data_type: STRING
  - name: ins_batchid
    data_type: INT
  - name: upd_batchid
    data_type: INT
  - name: Exportdate
    data_type: TIMESTAMP
  - name: valid_from
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: valid_to
    expression: CAST(NULL AS TIMESTAMP)
    data_type: TIMESTAMP
  - name: is_current
    expression: CAST(TRUE AS BOOLEAN)
    data_type: BOOLEAN
