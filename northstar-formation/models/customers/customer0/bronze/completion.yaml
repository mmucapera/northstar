# CUSTOMER0 bronze completion - completion reference data. Shape matches Project
# Spark's `DimCompletion` type (src/data/warehouse.ts), translated to
# customer0's Id/PascalCase convention.
# Pre-discovery - see docs/customer0-pilot-kickoff.md.

model:
  name: completion
  description: CUSTOMER0 bronze completion reference data
  layer: bronze
  kind: TABLE
  extends: null
  customer: customer0
  owner: data_engineering
  tags: [bronze, schema_only, customer0, oil_gas, pre_discovery, dim]
  refresh_frequency: daily
  domain: bronze
source:
  base_table: __SCHEMA_ONLY__
transformations:
  inherit_columns: false
  columns:
  - name: CompletionId
    data_type: VARCHAR(70)
    description: Stable completion slug (natural key) - e.g. "WEL-obago-001-B1-C1"
  - name: WellboreId
    data_type: VARCHAR(60)
    description: Parent wellbore (FK to dim_wellbore)
  - name: WellId
    data_type: VARCHAR(50)
    description: Parent well (FK to dim_well)
  - name: CompletionType
    data_type: VARCHAR(30)
    description: One of Single string, Dual string, Gas lift, ESP, Natural flow
  - name: ReservoirUnit
    data_type: VARCHAR(100)
  - name: PerforationTopM
    data_type: DECIMAL(18,2)
  - name: PerforationBaseM
    data_type: DECIMAL(18,2)
  - name: ArtificialLift
    data_type: VARCHAR(100)
  - name: CompletionDate
    data_type: DATE
  - name: IsActive
    data_type: BOOLEAN
  - name: Sourcefile
    data_type: STRING
  - name: Manifest_package
    data_type: STRING
  - name: Manifest_file
    data_type: STRING
  - name: Load_date
    expression: current_date
    data_type: DATE
  - name: Load_timestamp
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: Partitionkey
    data_type: STRING
  - name: ins_batchid
    data_type: INT
  - name: upd_batchid
    data_type: INT
  - name: Exportdate
    data_type: TIMESTAMP
  - name: valid_from
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: valid_to
    expression: CAST(NULL AS TIMESTAMP)
    data_type: TIMESTAMP
  - name: is_current
    expression: CAST(TRUE AS BOOLEAN)
    data_type: BOOLEAN
