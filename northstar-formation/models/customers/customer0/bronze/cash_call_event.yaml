# CUSTOMER0 bronze cash_call_event - status-change trail for each cash call, one
# row per event (submitted -> under-review -> settled/disputed). Matches
# Project Spark's `CashCallEvent`/`CashCall` types exactly
# (src/data/delta-basin.ts, cashCallTrail()). A cash call is identified by
# (PeriodId, PartnerId, FieldId); Stage distinguishes events within it.
# Pre-discovery - see docs/customer0-pilot-kickoff.md.

model:
  name: cash_call_event
  description: CUSTOMER0 bronze cash-call status-change events
  layer: bronze
  kind: TABLE
  extends: null
  customer: customer0
  owner: data_engineering
  tags: [bronze, schema_only, customer0, oil_gas, pre_discovery]
  refresh_frequency: daily
  domain: bronze
source:
  base_table: __SCHEMA_ONLY__
transformations:
  inherit_columns: false
  columns:
  - name: PeriodId
    data_type: VARCHAR(7)
  - name: PartnerId
    data_type: VARCHAR(50)
  - name: FieldId
    data_type: VARCHAR(50)
  - name: Stage
    data_type: VARCHAR(20)
    description: One of submitted, under-review, settled, disputed
  - name: EventTimestamp
    data_type: TIMESTAMP
  - name: Note
    data_type: VARCHAR(500)
  - name: Sourcefile
    data_type: STRING
  - name: Manifest_package
    data_type: STRING
  - name: Manifest_file
    data_type: STRING
  - name: Load_date
    expression: current_date
    data_type: DATE
  - name: Load_timestamp
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: Partitionkey
    data_type: STRING
  - name: ins_batchid
    data_type: INT
  - name: upd_batchid
    data_type: INT
  - name: Exportdate
    data_type: TIMESTAMP
