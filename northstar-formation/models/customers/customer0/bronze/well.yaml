# CUSTOMER0 bronze well - well header reference data. Shape matches Project
# Spark's `DimWell` type (src/data/warehouse.ts), translated to customer0's
# Id/PascalCase convention.
# Pre-discovery - see docs/customer0-pilot-kickoff.md.
#
# dim_/fact_ naming is reserved for gold - see bronze/partner.yaml.
# Operator FK points at the existing partner entity (dim_partner), not a
# new dim_operator.

model:
  name: well
  description: CUSTOMER0 bronze well header reference data
  layer: bronze
  kind: TABLE
  extends: null
  customer: customer0
  owner: data_engineering
  tags: [bronze, schema_only, customer0, oil_gas, pre_discovery, dim]
  refresh_frequency: daily
  domain: bronze
source:
  base_table: __SCHEMA_ONLY__
transformations:
  inherit_columns: false
  columns:
  - name: WellId
    data_type: VARCHAR(50)
    description: Stable well slug (natural key) - e.g. "WEL-obago-001"
  - name: WellName
    data_type: VARCHAR(200)
    description: Display name - e.g. "Obago-01"
  - name: FieldId
    data_type: VARCHAR(50)
    description: Field this well belongs to (FK to dim_field)
  - name: FacilityId
    data_type: VARCHAR(50)
    description: Flowstation/facility this well routes to (FK to dim_facility)
  - name: PartnerId
    data_type: VARCHAR(50)
    description: Operating partner (FK to existing dim_partner)
  - name: WellType
    data_type: VARCHAR(30)
    description: One of Oil producer, Gas producer, Water injector, Gas injector
  - name: Status
    data_type: VARCHAR(20)
    description: One of Producing, Shut-in, Drilling, Suspended
  - name: SpudDate
    data_type: DATE
  - name: TotalDepthM
    data_type: DECIMAL(18,2)
  - name: Sourcefile
    data_type: STRING
  - name: Manifest_package
    data_type: STRING
  - name: Manifest_file
    data_type: STRING
  - name: Load_date
    expression: current_date
    data_type: DATE
  - name: Load_timestamp
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: Partitionkey
    data_type: STRING
  - name: ins_batchid
    data_type: INT
  - name: upd_batchid
    data_type: INT
  - name: Exportdate
    data_type: TIMESTAMP
  - name: valid_from
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: valid_to
    expression: CAST(NULL AS TIMESTAMP)
    data_type: TIMESTAMP
  - name: is_current
    expression: CAST(TRUE AS BOOLEAN)
    data_type: BOOLEAN
