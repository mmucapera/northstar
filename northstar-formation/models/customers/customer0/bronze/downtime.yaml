# CUSTOMER0 bronze downtime - deferred production hours by cause and period.
# Matches Project Spark's `downtimeForPeriod`/`downtimeTrend` shape
# (src/data/delta-basin.ts). Downtime causes are a hypothesis, not a
# confirmed CUSTOMER0 taxonomy - see dim_downtime_cause.
# Pre-discovery - see docs/customer0-pilot-kickoff.md.

model:
  name: downtime
  description: CUSTOMER0 bronze deferred production hours by cause and period
  layer: bronze
  kind: TABLE
  extends: null
  customer: customer0
  owner: data_engineering
  tags: [bronze, schema_only, customer0, oil_gas, pre_discovery]
  refresh_frequency: daily
  domain: bronze
source:
  base_table: __SCHEMA_ONLY__
transformations:
  inherit_columns: false
  columns:
  - name: PeriodId
    data_type: VARCHAR(7)
  - name: CauseId
    data_type: VARCHAR(50)
  - name: Hours
    data_type: DECIMAL(18,2)
  - name: Sourcefile
    data_type: STRING
  - name: Manifest_package
    data_type: STRING
  - name: Manifest_file
    data_type: STRING
  - name: Load_date
    expression: current_date
    data_type: DATE
  - name: Load_timestamp
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: Partitionkey
    data_type: STRING
  - name: ins_batchid
    data_type: INT
  - name: upd_batchid
    data_type: INT
  - name: Exportdate
    data_type: TIMESTAMP
