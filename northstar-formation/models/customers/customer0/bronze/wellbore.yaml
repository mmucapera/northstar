# CUSTOMER0 bronze wellbore - wellbore trajectory reference data. Shape matches
# Project Spark's `DimWellbore` type (src/data/warehouse.ts), translated to
# customer0's Id/PascalCase convention.
# Pre-discovery - see docs/customer0-pilot-kickoff.md.

model:
  name: wellbore
  description: CUSTOMER0 bronze wellbore reference data
  layer: bronze
  kind: TABLE
  extends: null
  customer: customer0
  owner: data_engineering
  tags: [bronze, schema_only, customer0, oil_gas, pre_discovery, dim]
  refresh_frequency: daily
  domain: bronze
source:
  base_table: __SCHEMA_ONLY__
transformations:
  inherit_columns: false
  columns:
  - name: WellboreId
    data_type: VARCHAR(60)
    description: Stable wellbore slug (natural key) - e.g. "WEL-obago-001-B1"
  - name: WellId
    data_type: VARCHAR(50)
    description: Parent well (FK to dim_well)
  - name: WellboreName
    data_type: VARCHAR(200)
  - name: Trajectory
    data_type: VARCHAR(20)
    description: One of Vertical, Deviated, Horizontal
  - name: IsSidetrack
    data_type: BOOLEAN
  - name: MeasuredDepthM
    data_type: DECIMAL(18,2)
  - name: TrueVerticalDepthM
    data_type: DECIMAL(18,2)
  - name: Sourcefile
    data_type: STRING
  - name: Manifest_package
    data_type: STRING
  - name: Manifest_file
    data_type: STRING
  - name: Load_date
    expression: current_date
    data_type: DATE
  - name: Load_timestamp
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: Partitionkey
    data_type: STRING
  - name: ins_batchid
    data_type: INT
  - name: upd_batchid
    data_type: INT
  - name: Exportdate
    data_type: TIMESTAMP
  - name: valid_from
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: valid_to
    expression: CAST(NULL AS TIMESTAMP)
    data_type: TIMESTAMP
  - name: is_current
    expression: CAST(TRUE AS BOOLEAN)
    data_type: BOOLEAN
