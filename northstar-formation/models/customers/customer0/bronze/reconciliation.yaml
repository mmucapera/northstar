# CUSTOMER0 bronze reconciliation - JV allocation/lifting/cash-call records, one
# row per partner/field/period. Shape matches Project Spark's
# `ReconciliationRow` type exactly (src/data/delta-basin.ts).
# Pre-discovery - see docs/customer0-pilot-kickoff.md.

model:
  name: reconciliation
  description: CUSTOMER0 bronze JV allocation/lifting/cash-call records
  layer: bronze
  kind: TABLE
  extends: null
  customer: customer0
  owner: data_engineering
  tags: [bronze, schema_only, customer0, oil_gas, pre_discovery]
  refresh_frequency: daily
  domain: bronze
source:
  base_table: __SCHEMA_ONLY__
transformations:
  inherit_columns: false
  columns:
  - name: PeriodId
    data_type: VARCHAR(7)
  - name: FieldId
    data_type: VARCHAR(50)
  - name: PartnerId
    data_type: VARCHAR(50)
  - name: AllocatedBbl
    data_type: DECIMAL(18,2)
    description: Volume allocated to this partner, barrels
  - name: LiftedBbl
    data_type: DECIMAL(18,2)
    description: Volume actually lifted by this partner, barrels
  - name: CashCallStatus
    data_type: VARCHAR(20)
    description: One of settled, pending, disputed
  - name: CashCallUsd
    data_type: DECIMAL(18,2)
    description: Cash call amount, USD
  - name: Sourcefile
    data_type: STRING
  - name: Manifest_package
    data_type: STRING
  - name: Manifest_file
    data_type: STRING
  - name: Load_date
    expression: current_date
    data_type: DATE
  - name: Load_timestamp
    expression: current_timestamp
    data_type: TIMESTAMP
  - name: Partitionkey
    data_type: STRING
  - name: ins_batchid
    data_type: INT
  - name: upd_batchid
    data_type: INT
  - name: Exportdate
    data_type: TIMESTAMP
