# Azure DevOps CI Pipeline for Northstar Formation
# Uses uv for fast, reliable Python package management

trigger:
  branches:
    include:
      - feature/uix/*

pr:
  branches:
    include:
      - main

pool:
  name: iac_linux

variables:
  - group: ProGet-Credentials
  - name: pythonVersion
    value: '3.11'
  - name: projectRoot
    value: 'Unison Insight Services'

