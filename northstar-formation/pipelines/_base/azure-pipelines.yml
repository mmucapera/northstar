  - stage: Build
    displayName: 'Build Package'
    # dependsOn: Test
    condition: succeeded()
    jobs:
      - job: Build
        displayName: 'Build and Publish Artifact'
        steps:
          - script: |
              echo "=== System Python ==="
              python3 --version
            displayName: 'Check Python availability'

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Install uv'

          - script: |
              uv build
            displayName: 'Build package'
            workingDirectory: '$(projectRoot)'

          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(projectRoot)/dist'
              artifact: 'python-package'
            displayName: 'Publish package artifact'

  - stage: Publish
    displayName: 'Publish to ProGet'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: PublishToProGet
        displayName: 'Publish Package to ProGet'
        steps:
          - download: current
            artifact: python-package
            displayName: 'Download package artifact'

          - script: |
              echo "=== System Python ==="
              python3 --version
            displayName: 'Check Python availability'

          - script: |
              curl -LsSf https://astral.sh/uv/install.sh | sh
              echo "##vso[task.prependpath]$HOME/.local/bin"
            displayName: 'Install uv'

          - script: |
              echo "=== Debug: Variable Check ==="
              echo "Feed URL: $(PROGET_FEED_URL)"
              echo "API Key set: $(if [ -n "$PROGET_API_KEY" ]; then echo 'YES'; else echo 'NO'; fi)"
              echo "API Key length: ${#PROGET_API_KEY}"
              echo "API Key first 4 chars: ${PROGET_API_KEY:0:4}..."
              echo ""
              echo "=== Debug: Package files ==="
              ls -la $(Pipeline.Workspace)/python-package/
              echo ""
              echo "=== Debug: Test API endpoint with Basic Auth ==="
              curl -I --insecure -u "api:$PROGET_API_KEY" "$(PROGET_FEED_URL)/" || echo "Curl failed with exit code: $?"
            displayName: 'Debug - Check variables and connectivity'
            env:
              PROGET_API_KEY: $(PROGET_API_KEY)

          - script: |
              # Try with token auth (ProGet API key as token)
              uv publish --verbose \
                --publish-url "$(PROGET_FEED_URL)/" \
                --token "$PROGET_API_KEY" \
                --allow-insecure-host omhqproget \
                $(Pipeline.Workspace)/python-package/*
            displayName: 'Publish to ProGet'
            env:
              PROGET_API_KEY: $(PROGET_API_KEY)
