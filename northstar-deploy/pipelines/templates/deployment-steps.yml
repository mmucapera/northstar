# =============================================================================
# Deployment Steps Template
# =============================================================================
# Reusable template for deploying Fabric items to a single environment
# Used by all environment-specific stages

parameters:
  - name: customerID
    type: string
  - name: environment
    type: string
  - name: deploymentMode
    type: string
  - name: workingDir
    type: string

steps:
  - checkout: self
    fetchDepth: 1
  - checkout: customer_repo

  - task: UsePythonVersion@0
    displayName: 'Setup Python $(pythonVersion)'
    inputs:
      versionSpec: '$(pythonVersion)'

  - script: |
      python -m pip install --upgrade pip
      pip install -r "${{ parameters.workingDir }}/requirements.txt" 2>/dev/null || \
      pip install fabric-cicd pyyaml pydantic requests colorlog azure-identity ms-fabric-cli
    displayName: 'Install dependencies'

  # ---------------------------------------------------------------------------
  # STEP 1: Deploy Lakehouse
  # ---------------------------------------------------------------------------
  - script: |
      cd "${{ parameters.workingDir }}"
      python scripts/deployment/deploy_orchestrator.py \
        --customer ${{ parameters.customerID }} \
        --environment ${{ parameters.environment }} \
        --mode ${{ parameters.deploymentMode }} \
        --phase lakehouse \
        --build-id $(Build.BuildId) \
        --user "$(Build.RequestedFor)"
    displayName: 'Phase 1: Deploy Lakehouse'
    env:
      TENANT_ID: $(TENANT_ID)
      CLIENT_ID: $(CLIENT_ID)
      CLIENT_SECRET: $(CLIENT_SECRET)

  # ---------------------------------------------------------------------------
  # STEP 2: Deploy Notebooks
  # ---------------------------------------------------------------------------
  - script: |
      cd "${{ parameters.workingDir }}"
      python scripts/deployment/deploy_orchestrator.py \
        --customer ${{ parameters.customerID }} \
        --environment ${{ parameters.environment }} \
        --mode ${{ parameters.deploymentMode }} \
        --phase notebooks \
        --build-id $(Build.BuildId) \
        --user "$(Build.RequestedFor)"
    displayName: 'Phase 2: Deploy Notebooks'
    env:
      TENANT_ID: $(TENANT_ID)
      CLIENT_ID: $(CLIENT_ID)
      CLIENT_SECRET: $(CLIENT_SECRET)

  # ---------------------------------------------------------------------------
  # STEP 3: Execute Notebooks (create tables)
  # ---------------------------------------------------------------------------
  - script: |
      cd "${{ parameters.workingDir }}"
      python scripts/deployment/deploy_orchestrator.py \
        --customer ${{ parameters.customerID }} \
        --environment ${{ parameters.environment }} \
        --mode ${{ parameters.deploymentMode }} \
        --phase table_creation \
        --build-id $(Build.BuildId) \
        --user "$(Build.RequestedFor)"
    displayName: 'Phase 3: Execute Notebooks'
    env:
      TENANT_ID: $(TENANT_ID)
      CLIENT_ID: $(CLIENT_ID)
      CLIENT_SECRET: $(CLIENT_SECRET)

  # ---------------------------------------------------------------------------
  # STEP 4: Deploy Semantic Model & Reports
  # ---------------------------------------------------------------------------
  - script: |
      cd "${{ parameters.workingDir }}"
      python scripts/deployment/deploy_orchestrator.py \
        --customer ${{ parameters.customerID }} \
        --environment ${{ parameters.environment }} \
        --mode ${{ parameters.deploymentMode }} \
        --phase semantic_layer \
        --build-id $(Build.BuildId) \
        --user "$(Build.RequestedFor)"
    displayName: 'Phase 4: Deploy Semantic Layer'
    env:
      TENANT_ID: $(TENANT_ID)
      CLIENT_ID: $(CLIENT_ID)
      CLIENT_SECRET: $(CLIENT_SECRET)

  # ---------------------------------------------------------------------------
  # Collect deployment artifacts
  # ---------------------------------------------------------------------------
  - script: |
      # Find and publish deployment report
      REPORT=$(find "${{ parameters.workingDir }}" -name "deployment_report_*.json" -type f -mmin -5 | head -1)
      if [ -n "$REPORT" ]; then
        cp "$REPORT" "$(Build.ArtifactStagingDirectory)/deployment-report-${{ parameters.environment }}.json"
        echo "##vso[task.setvariable variable=reportPath]$REPORT"
      fi
    displayName: 'Collect deployment report'
    condition: always()

  - task: PublishPipelineArtifact@1
    displayName: 'Publish deployment report'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)'
      artifactName: 'deployment-${{ parameters.customerID }}-${{ parameters.environment }}-$(Build.BuildId)'
    condition: always()
