# Customer Configuration Template
# Copy this folder to create a new customer configuration
# Replace all placeholders with actual values

# ============================================================================
# METADATA SECTION - Custom tracking information (not used by fabric-cicd)
# ============================================================================
metadata:
  customer_id: "customer-xxx"  # Unique customer identifier
  customer_name: "Customer Name"  # Full customer name
  created_date: "2024-01-01"  # Configuration creation date
  maintained_by: "team@company.com"  # Team responsible for this customer
  deployment_mode: "standard"
  description: "Brief description of customer deployment"

# ============================================================================
# CORE SECTION - Native fabric-cicd configuration
# ============================================================================
core:
  # Workspace IDs for each environment (REQ-003)
  # Get these from Fabric portal or via API
  workspace_id:
    dev: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    test: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    uat: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    prod: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

  # Repository directory containing Fabric items (REQ-013)
  # Can be relative (to this config file) or absolute paths
  repository_directory:
    dev: "./versions/v2.0.0"    # Latest development version
    test: "./versions/v2.0.0"   # Testing same as dev
    uat: "./versions/v1.1.0"    # UAT on previous stable
    prod: "./versions/v1.0.0"   # Production on stable release

  # Item types to deploy (REQ-014)
  # Order here doesn't matter, use deployment_sequence for ordering
  item_types_in_scope:
    - Lakehouse
    - Notebook
    - DataPipeline
    - SemanticModel
    - Report
    # Supported types: DataPipeline, Environment, Notebook, Report,
    # SemanticModel, Lakehouse, MirroredDatabase, Warehouse, SQLDatabase,
    # Eventstream, Eventhouse, KQLDatabase, KQLQueryset, Reflex

  # Parameter files for find/replace operations (REQ-004, REQ-017)
  parameter:
    dev: "./parameters/dev.yml"
    test: "./parameters/test.yml"
    uat: "./parameters/uat.yml"
    prod: "./parameters/prod.yml"

# ============================================================================
# DEPLOYMENT SECTION - Custom orchestration settings
# ============================================================================
deployment:
  # Deployment sequence - items deployed in this order (REQ-008, REQ-016)
  deployment_sequence:
    - Lakehouse        # Deploy first (no dependencies)
    - Notebook         # Deploy second (depends on Lakehouse)
    - DataPipeline     # Deploy third (depends on Lakehouse)
    - SemanticModel    # Deploy fourth (depends on Lakehouse)
    - Report           # Deploy last (depends on SemanticModel)

  # Deployment modes configuration (REQ-006)
  modes:
    full:
      enabled: true
      cleanup_orphans: true      # Remove items not in repository
      validate_all: true         # Run all validations
    incremental:
      enabled: true
      cleanup_orphans: false     # Keep existing items
      validate_changes_only: true
    selective:
      enabled: true
      cleanup_orphans: false     # Never remove in selective mode (REQ-023)
      skip_validation: false     # Can skip non-essential validation (REQ-021)

  # Retry configuration (REQ-019)
  retry:
    max_attempts: 3              # Maximum retry attempts
    backoff_seconds: 30          # Initial backoff duration
    retriable_errors:            # Error types to retry
      - "TooManyRequests"
      - "ServiceUnavailable"
      - "GatewayTimeout"

# ============================================================================
# PUBLISH SECTION - Native fabric-cicd publish configuration
# ============================================================================
publish:
  # Regex patterns to exclude items from publishing
  exclude_regex:
    dev: "^(TEMPLATE_|DEPRECATED_).*"
    test: "^(TEMPLATE_|DEPRECATED_|DEV_ONLY_).*"
    uat: "^(TEMPLATE_|DEPRECATED_|DEV_ONLY_|TEST_ONLY_).*"
    prod: "^(TEMPLATE_|DEPRECATED_|DEV_ONLY_|TEST_ONLY_|DEBUG_).*"

  # Exclude items in specific folders
  folder_exclude_regex:
    dev: "^archive/"
    test: "^(archive/|experimental/).*"
    uat: "^(archive/|experimental/|testing/).*"
    prod: "^(archive/|experimental/|testing/|staging/).*"

  # Skip publishing for specific environments
  skip:
    dev: false
    test: false
    uat: false
    prod: false

# ============================================================================
# UNPUBLISH SECTION - Native fabric-cicd unpublish configuration
# ============================================================================
unpublish:
  # Items matching this pattern won't be removed (even if orphaned)
  exclude_regex: "^(SYSTEM_|SHARED_|READONLY_).*"

  # Skip unpublishing for specific environments
  skip:
    dev: false    # Allow cleanup in dev
    test: false   # Allow cleanup in test
    uat: true     # No auto-cleanup in UAT (safer)
    prod: true    # Never auto-cleanup in production

# ============================================================================
# FEATURES SECTION - Required fabric-cicd feature flags
# ============================================================================
features:
  - enable_experimental_features  # Required for config deployment
  - enable_config_deploy          # Required for deploy_with_config()
  - enable_items_to_include       # For selective deployment (REQ-020)
  - enable_exclude_folder         # For folder exclusions
  - enable_response_collection    # To get deployment responses

# ============================================================================
# VALIDATION SECTION - Custom validation checks (REQ-007)
# ============================================================================
validation:
  # Pre-deployment checks
  pre_deployment:
    - check_workspace_exists     # Verify workspace is accessible
    - check_capacity_available   # Verify capacity is active
    - validate_connections       # Check required connections
    - verify_dependencies       # Verify item dependencies
    - check_version_compatibility  # Verify version compatibility
    - validate_parameter_files  # Validate parameter file format

  # Post-deployment checks
  post_deployment:
    - verify_item_count         # Verify expected items deployed
    - test_connections          # Test data connections work
    - run_smoke_tests          # Run basic functionality tests
    - verify_specific_items    # For selective deployment verification

# ============================================================================
# NOTIFICATIONS SECTION - Optional notification settings (custom)
# ============================================================================
notifications:
  enabled: false
  channels:
    teams:
      webhook_url: ""  # Teams webhook URL
      notify_on: ["failure", "success_with_warnings"]
    email:
      recipients: []
      notify_on: ["failure"]

# ============================================================================
# MONITORING SECTION - Optional monitoring settings (custom)
# ============================================================================
monitoring:
  enabled: false
  log_level: "INFO"  # DEBUG | INFO | WARNING | ERROR
  retention_days: 30  # How long to keep deployment logs
